# acm/gitops/acm-gitops-perm-binding.yaml
# Binds the openshift-gitops-policy-admin ClusterRole to the
# ArgoCD application controller ServiceAccount.
# Apply once on the ACM hub after acm-gitops-perm-clusterrole.yaml.
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: openshift-gitops-policy-admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-gitops-policy-admin
