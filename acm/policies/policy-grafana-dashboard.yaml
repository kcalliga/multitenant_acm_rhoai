# acm/policies/policy-grafana-dashboard.yaml
# Deploys a DCGM GPU metrics dashboard into each tenant's Grafana instance.
# The dashboard JSON uses a hidden namespace constant variable so each
# tenant's dashboard only queries metrics from pods in their own namespace.
#
# Depends on policy-grafana-instances being enforced first.
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-grafana-dashboard
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    # ── Dashboard - usera ──────────────────────────────────────────────────
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: grafana-dashboard-usera
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: grafana.integreatly.org/v1beta1
                kind: GrafanaDashboard
                metadata:
                  name: gpu-metrics-usera
                  namespace: usera
                spec:
                  instanceSelector:
                    matchLabels:
                      dashboards: grafana-usera
                  json: |
                    {
                      "title": "GPU Metrics - User A",
                      "uid": "gpu-usera",
                      "tags": ["gpu", "dcgm", "usera"],
                      "timezone": "browser",
                      "refresh": "30s",
                      "time": { "from": "now-1h", "to": "now" },
                      "templating": {
                        "list": [
                          {
                            "name": "namespace",
                            "type": "constant",
                            "query": "usera",
                            "hide": 2,
                            "label": "Namespace"
                          },
                          {
                            "name": "pod",
                            "type": "query",
                            "datasource": "Prometheus",
                            "query": "label_values(DCGM_FI_DEV_GPU_UTIL{exported_namespace=\"$namespace\"}, pod)",
                            "refresh": 2,
                            "includeAll": true,
                            "multi": false,
                            "label": "Pod"
                          }
                        ]
                      },
                      "panels": [
                        {
                          "id": 1,
                          "title": "GPU Utilization %",
                          "type": "timeseries",
                          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "DCGM_FI_DEV_GPU_UTIL{exported_namespace=\"$namespace\", pod=~\"$pod\"}",
                              "legendFormat": "GPU Util - {{pod}}"
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "unit": "percent", "min": 0, "max": 100,
                              "thresholds": { "mode": "absolute", "steps": [
                                { "color": "green", "value": null },
                                { "color": "yellow", "value": 70 },
                                { "color": "red", "value": 90 }
                              ]}
                            }
                          }
                        },
                        {
                          "id": 2,
                          "title": "GPU Memory Used (MiB)",
                          "type": "timeseries",
                          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "DCGM_FI_DEV_FB_USED{exported_namespace=\"$namespace\", pod=~\"$pod\"}",
                              "legendFormat": "FB Used - {{pod}}"
                            },
                            {
                              "expr": "DCGM_FI_DEV_FB_FREE{exported_namespace=\"$namespace\", pod=~\"$pod\"}",
                              "legendFormat": "FB Free - {{pod}}"
                            }
                          ],
                          "fieldConfig": { "defaults": { "unit": "decmbytes", "min": 0 } }
                        },
                        {
                          "id": 3,
                          "title": "GPU Temperature (°C)",
                          "type": "timeseries",
                          "gridPos": { "x": 0, "y": 8, "w": 8, "h": 7 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "DCGM_FI_DEV_GPU_TEMP{exported_namespace=\"$namespace\", pod=~\"$pod\"}",
                              "legendFormat": "Temp - {{pod}}"
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "unit": "celsius",
                              "thresholds": { "mode": "absolute", "steps": [
                                { "color": "green", "value": null },
                                { "color": "yellow", "value": 70 },
                                { "color": "red", "value": 85 }
                              ]}
                            }
                          }
                        },
                        {
                          "id": 4,
                          "title": "Memory Copy Utilization %",
                          "type": "timeseries",
                          "gridPos": { "x": 8, "y": 8, "w": 8, "h": 7 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "DCGM_FI_DEV_MEM_COPY_UTIL{exported_namespace=\"$namespace\", pod=~\"$pod\"}",
                              "legendFormat": "Mem Copy Util - {{pod}}"
                            }
                          ],
                          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } }
                        },
                        {
                          "id": 5,
                          "title": "Power Draw (W)",
                          "type": "timeseries",
                          "gridPos": { "x": 16, "y": 8, "w": 8, "h": 7 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "DCGM_FI_DEV_POWER_USAGE{exported_namespace=\"$namespace\", pod=~\"$pod\"}",
                              "legendFormat": "Power - {{pod}}"
                            }
                          ],
                          "fieldConfig": { "defaults": { "unit": "watt" } }
                        },
                        {
                          "id": 6,
                          "title": "GPU Utilization - Now",
                          "type": "gauge",
                          "gridPos": { "x": 0, "y": 15, "w": 6, "h": 5 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "avg(DCGM_FI_DEV_GPU_UTIL{exported_namespace=\"$namespace\", pod=~\"$pod\"})",
                              "legendFormat": "GPU Util"
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "unit": "percent", "min": 0, "max": 100,
                              "thresholds": { "mode": "absolute", "steps": [
                                { "color": "green", "value": null },
                                { "color": "yellow", "value": 70 },
                                { "color": "red", "value": 90 }
                              ]}
                            }
                          }
                        },
                        {
                          "id": 7,
                          "title": "GPU Memory Used - Now",
                          "type": "gauge",
                          "gridPos": { "x": 6, "y": 15, "w": 6, "h": 5 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "avg(DCGM_FI_DEV_FB_USED{exported_namespace=\"$namespace\", pod=~\"$pod\"})",
                              "legendFormat": "FB Used"
                            }
                          ],
                          "fieldConfig": { "defaults": { "unit": "decmbytes", "min": 0 } }
                        },
                        {
                          "id": 8,
                          "title": "GPU Temperature - Now",
                          "type": "gauge",
                          "gridPos": { "x": 12, "y": 15, "w": 6, "h": 5 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "avg(DCGM_FI_DEV_GPU_TEMP{exported_namespace=\"$namespace\", pod=~\"$pod\"})",
                              "legendFormat": "Temp"
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "unit": "celsius", "min": 0,
                              "thresholds": { "mode": "absolute", "steps": [
                                { "color": "green", "value": null },
                                { "color": "yellow", "value": 70 },
                                { "color": "red", "value": 85 }
                              ]}
                            }
                          }
                        },
                        {
                          "id": 9,
                          "title": "Power Draw - Now",
                          "type": "gauge",
                          "gridPos": { "x": 18, "y": 15, "w": 6, "h": 5 },
                          "datasource": "Prometheus",
                          "targets": [
                            {
                              "expr": "avg(DCGM_FI_DEV_POWER_USAGE{exported_namespace=\"$namespace\", pod=~\"$pod\"})",
                              "legendFormat": "Power"
                            }
                          ],
                          "fieldConfig": { "defaults": { "unit": "watt", "min": 0 } }
                        }
                      ],
                      "schemaVersion": 36
                    }

