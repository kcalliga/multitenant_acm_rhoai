---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDataSource
metadata:
  name: prometheus-usera
  namespace: usera
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-usera
  datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      isDefault: true
      jsonData:
        httpHeaderName1: Authorization
        timeInterval: 30s
        tlsSkipVerify: true
      secureJsonData:
        httpHeaderValue1: >-
          Bearer ${GRAFANA_SA_TOKEN}
      editable: false
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDataSource
metadata:
  name: prometheus-userb
  namespace: userb
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-userb
  datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
      isDefault: true
      jsonData:
        httpHeaderName1: Authorization
        timeInterval: 30s
        tlsSkipVerify: true
      secureJsonData:
        httpHeaderValue1: >-
          Bearer ${GRAFANA_SA_TOKEN}
      editable: false
