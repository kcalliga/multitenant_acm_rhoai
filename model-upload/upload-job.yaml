                secretKeyRef:
                  name: aws-connection-granite-userb
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-connection-granite-userb
